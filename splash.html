<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent; /* transparent para round/diamond lang yung logo ang lalabas */
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap {
      animation: fadeInScale 0.6s ease-out, pulse 2s ease-in-out infinite 0.6s;
    }

    img {
      width: 300px;
      height: 300px;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <img src="MICT-Logo-PROMPTER.png" alt="MICT Prompter" />
  </div>
</body>
</html>
